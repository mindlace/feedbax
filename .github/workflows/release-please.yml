name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_dmg:
        description: 'Build the DMG even without a release (dry run; nothing is uploaded)'
        type: boolean
        default: false

concurrency:
  group: release-please
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      # No GitHub App token here, unlike planafoot: nothing listens on
      # `release: published`, so GITHUB_TOKEN's suppressed events cost us
      # nothing. The DMG job below is a `needs:` job in this same workflow.
      - uses: googleapis/release-please-action@v5.0.0
        id: rp
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  dmg:
    needs: release-please
    if: >-
      needs.release-please.outputs.release_created == 'true' ||
      inputs.force_dmg
    runs-on: macos-15
    env:
      DEVELOPMENT_TEAM: ${{ vars.DEVELOPMENT_TEAM }}
      NOTARY_PROFILE: feedbax-notary
    steps:
      - uses: actions/checkout@v5
        with:
          # build-dmg.sh derives BUILD_NUMBER from `git rev-list --count HEAD`.
          fetch-depth: 0

      - name: Select Xcode
        run: echo "DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer" >> "$GITHUB_ENV"

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Determine version
        # Used only to name the artifact we collect below. build-dmg.sh
        # derives its own VERSION from version.txt the same way; this just
        # gives the workflow the same value without parsing build-dmg.sh's
        # output. On a real release this equals the version release-please
        # just bumped and committed to main; on a force_dmg dry run there is
        # no tag to derive it from, so version.txt (whatever is currently on
        # the checked-out ref) is the only thing to name it after.
        run: echo "VERSION=$(cat version.txt)" >> "$GITHUB_ENV"

      - name: Import signing certificate
        env:
          CERT_P12: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(uuidgen)"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"

          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" \
            -k "$keychain" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"

          # Without this, codesign blocks on a GUI keychain prompt that no one
          # can answer on a runner.
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$keychain_password" "$keychain" >/dev/null

          # Prepend, keeping the login keychain so Apple's roots stay visible.
          security list-keychains -d user -s "$keychain" login.keychain-db
          security find-identity -v -p codesigning "$keychain"

          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Store notarization credentials
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          echo "$NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          xcrun notarytool store-credentials "$NOTARY_PROFILE" \
            --key "$RUNNER_TEMP/notary.p8" \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" \
            --keychain "$SIGNING_KEYCHAIN"
          rm -f "$RUNNER_TEMP/notary.p8"

          # build-dmg.sh must name the same keychain on every notarytool call —
          # a profile stored here is invisible to a bare --keychain-profile.
          echo "NOTARY_KEYCHAIN=$SIGNING_KEYCHAIN" >> "$GITHUB_ENV"

      - name: Build the DMG
        run: tools/release/build-dmg.sh

      - name: Upload the DMG to the release
        # Exact filename, not a glob: build-dmg.sh only ever writes the
        # unnotarized-marker filename when SKIP_NOTARIZE is set, which this
        # workflow never sets, so this step always sees the notarized
        # dist/Feedbax-<version>.dmg. Naming it explicitly (derived from the
        # release tag, which is authoritative here) means a glob can never
        # accidentally sweep up a differently-named artifact from a stale or
        # concurrent dist/ — belt and suspenders with the SKIP_NOTARIZE
        # filename split in build-dmg.sh itself.
        if: needs.release-please.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          gh release upload "$TAG" "dist/Feedbax-${version}.dmg" --clobber

      - name: Keep the DMG on dry runs
        # Also exact, not a glob, and named from version.txt rather than a
        # tag (workflow_dispatch has no release tag to derive one from).
        # This job never sets SKIP_NOTARIZE, so a dry run still produces and
        # collects the real notarized dist/Feedbax-<version>.dmg — the point
        # of force_dmg per the workflow's own description is to exercise the
        # full sign-and-notarize pipeline as a smoke test, not to produce the
        # deliberately-unnotarized SKIP_NOTARIZE artifact, which has no
        # reason to ever reach this workflow.
        if: needs.release-please.outputs.release_created != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Feedbax-dmg
          path: dist/Feedbax-${{ env.VERSION }}.dmg

      - name: Delete the signing keychain
        if: always()
        run: security delete-keychain "$SIGNING_KEYCHAIN" || true
