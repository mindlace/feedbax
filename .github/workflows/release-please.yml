name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_dmg:
        description: 'Build the DMG even without a release (dry run; nothing is uploaded)'
        type: boolean
        default: false

concurrency:
  group: release-please
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      # release-please-action is running in manifest mode, where the outputs it
      # documents are the *plural* `releases_created` plus per-path outputs
      # (`.--tag_name` for the root package). The unprefixed singular names
      # exist only because the root package `.` is hoisted. Read both spellings
      # so a change to that hoisting cannot silently turn the `dmg` job's `if:`
      # false — a skipped job is a green run with no DMG attached.
      release_created: ${{ steps.rp.outputs.release_created || steps.rp.outputs.releases_created }}
      tag_name: ${{ steps.rp.outputs.tag_name || steps.rp.outputs['.--tag_name'] }}
    steps:
      # No GitHub App token here, unlike planafoot: nothing listens on
      # `release: published`, so GITHUB_TOKEN's suppressed events cost us
      # nothing. The DMG job below is a `needs:` job in this same workflow.
      - uses: googleapis/release-please-action@v5.0.0
        id: rp
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # The `dmg` job below is *skipped*, not failed, when the gate resolves
      # false — so an output rename in release-please would otherwise publish a
      # release with no DMG on a green run. This step turns that class of
      # change into a red build here, where it is visible.
      - name: Assert the release outputs resolved
        env:
          OUTPUTS: ${{ toJSON(steps.rp.outputs) }}
          CREATED: ${{ steps.rp.outputs.release_created || steps.rp.outputs.releases_created }}
          TAG: ${{ steps.rp.outputs.tag_name || steps.rp.outputs['.--tag_name'] }}
        run: |
          set -euo pipefail
          echo "release-please outputs:"
          echo "$OUTPUTS"

          if [[ "$CREATED" == "true" && -z "$TAG" ]]; then
            echo "::error::release-please created a release but no tag name resolved from either spelling. Update the job outputs in .github/workflows/release-please.yml."
            exit 1
          fi

          # Match a tag_name *key* (`"tag_name":` or `".--tag_name":`), not the
          # word anywhere in a value — nested JSON in the `prs` output arrives
          # escaped, so this cannot fire on a release PR's body.
          if [[ "$CREATED" != "true" ]] \
            && grep -qE '"[^"]*tag_name"[[:space:]]*:' <<<"$OUTPUTS"; then
            echo "::error::release-please emitted a tag_name but no created flag resolved from either spelling. Update the job outputs in .github/workflows/release-please.yml."
            exit 1
          fi

  dmg:
    needs: release-please
    if: >-
      needs.release-please.outputs.release_created == 'true' ||
      inputs.force_dmg
    runs-on: macos-15
    # Notarization waits on Apple, so this has to be generous — but not the
    # 6-hour default: a `codesign` that ends up blocked on a keychain prompt
    # no one can answer would otherwise hold a macOS runner all afternoon.
    timeout-minutes: 60
    env:
      DEVELOPMENT_TEAM: ${{ vars.DEVELOPMENT_TEAM }}
      NOTARY_PROFILE: feedbax-notary
    steps:
      - uses: actions/checkout@v5
        with:
          # build-dmg.sh derives BUILD_NUMBER from `git rev-list --count HEAD`.
          fetch-depth: 0

      - name: Assert the release tag resolved
        # Belt to the release-please job's braces: never notarize and upload
        # against an empty tag.
        if: needs.release-please.outputs.release_created == 'true'
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          if [[ -z "$TAG" ]]; then
            echo "::error::a release was created but no tag name reached this job"
            exit 1
          fi
          echo "releasing $TAG"

      - name: Select Xcode
        # Pinned, not /Applications/Xcode.app: that symlink follows whatever
        # the runner image currently defaults to, so an image bump could change
        # the compiler under a release with no commit in this repo. 16.4 is the
        # macos-15 image's current default, so this pins today's behaviour
        # rather than changing it. When the image drops this version the build
        # fails here, loudly, instead of drifting.
        run: |
          set -euo pipefail
          xcode="/Applications/Xcode_16.4.app"
          [[ -d "$xcode" ]] || {
            echo "::error::$xcode is not on this runner image — pick a version from the macos-15 image manifest and update this step"
            ls -d /Applications/Xcode*.app
            exit 1
          }
          echo "DEVELOPER_DIR=$xcode/Contents/Developer" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$xcode/Contents/Developer" xcodebuild -version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Import signing certificate
        env:
          CERT_P12: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(uuidgen)"

          security create-keychain -p "$keychain_password" "$keychain"
          # Recorded immediately, before anything that can fail: the final
          # always()-cleanup step needs this to find and delete the keychain
          # even if a later command below fails partway through. Recording it
          # only after a fully successful import would leave a half-built
          # keychain that cleanup has no name for.
          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"

          # Trap set before the decoded private key ever touches disk, so it
          # is removed on success, on failure, and on cancellation alike —
          # not just on the happy path via a trailing rm.
          trap 'rm -f "$RUNNER_TEMP/cert.p12"' EXIT
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" \
            -k "$keychain" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security

          # Without this, codesign blocks on a GUI keychain prompt that no one
          # can answer on a runner.
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$keychain_password" "$keychain" >/dev/null

          # Prepend, keeping the login keychain so Apple's roots stay visible.
          security list-keychains -d user -s "$keychain" login.keychain-db
          security find-identity -v -p codesigning "$keychain"

      - name: Store notarization credentials
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          # Trap set before the decoded key ever touches disk (see the
          # cert-import step above for the same reasoning).
          trap 'rm -f "$RUNNER_TEMP/notary.p8"' EXIT
          echo "$NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          xcrun notarytool store-credentials "$NOTARY_PROFILE" \
            --key "$RUNNER_TEMP/notary.p8" \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" \
            --keychain "$SIGNING_KEYCHAIN"

          # build-dmg.sh must name the same keychain on every notarytool call —
          # a profile stored here is invisible to a bare --keychain-profile.
          echo "NOTARY_KEYCHAIN=$SIGNING_KEYCHAIN" >> "$GITHUB_ENV"

      - name: Build the DMG
        run: tools/release/build-dmg.sh

      - name: Keep the built DMG as a run artifact
        # Positioned immediately after the build and marked always() so the DMG
        # survives a failure of anything below it. Notarization is irreversible
        # and takes minutes; without this, a failed verification or a failed
        # release upload would discard the runner — and re-running all jobs
        # re-runs release-please, which now finds nothing releasable and skips
        # this job, leaving the published release permanently DMG-less. This
        # only preserves the artifact; it never masks a failure, because the
        # failing step above it still fails the job.
        #
        # Covers the force_dmg dry run too, which is why there is no separate
        # dry-run upload step: two upload-artifact steps sharing one artifact
        # name is an error in v4.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Feedbax-dmg
          path: dist/*.dmg
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload the DMG to the release
        # Exact filename, not a glob: build-dmg.sh only ever writes the
        # unnotarized-marker filename when SKIP_NOTARIZE is set, which this
        # workflow never sets, so this step always sees the notarized
        # dist/Feedbax-<version>.dmg. Naming it explicitly (derived from the
        # release tag, which is authoritative here) means a glob can never
        # accidentally sweep up a differently-named artifact from a stale or
        # concurrent dist/ — belt and suspenders with the SKIP_NOTARIZE
        # filename split in build-dmg.sh itself.
        if: needs.release-please.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          gh release upload "$TAG" "dist/Feedbax-${version}.dmg" --clobber

      - name: Delete the signing keychain
        if: always()
        run: security delete-keychain "$SIGNING_KEYCHAIN" || true
