name: Feedbax
options: { bundleIdPrefix: net.mindlace, deploymentTarget: { macOS: "14.0" } }
packages: { FeedbaxKit: { path: . } }
targets:
  Feedbax:
    type: application
    platform: macOS
    sources: [App]
    dependencies: [{ package: FeedbaxKit, product: FeedbaxKit }]
    settings:
      base:
        # Placeholders. tools/release/build-dmg.sh overrides both on the
        # xcodebuild command line from version.txt and the build number, so a
        # release bundle never carries these values.
        MARKETING_VERSION: "0.0.0"
        CURRENT_PROJECT_VERSION: "0"
    info:
      path: App/Info.plist
      properties:
        NSMicrophoneUsageDescription: "Feedbax listens to the room to draw waveforms and bass bumps."
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
    entitlements: { path: App/Feedbax.entitlements, properties: { com.apple.security.device.audio-input: true } }
