[project]
name = "feedbax-admin"
version = "0.1.0"
description = "Local web admin for managing Feedbax overlay images"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "jinja2>=3.1",
    "python-multipart>=0.0.18",
    "pillow>=11.0",
    "pillow-heif>=0.21",
    "rembg[cpu]>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.28",
    "pytest-asyncio>=0.25",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
